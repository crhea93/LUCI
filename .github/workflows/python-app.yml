# CI for LUCI.
#
# The environment is described by pyproject.toml + uv.lock; `uv sync --locked`
# reproduces it exactly and fails if the lock has drifted.
#
# Inference runs on ONNX Runtime, so the suite runs on 3.10-3.13. Only the
# optional [ml-legacy] extra still needs TensorFlow, and only on 3.10.

name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main, refactor]
  schedule:
    # 07:00 UTC daily -- runs the slow golden fits that the PR job skips.
    - cron: "0 7 * * *"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # ruff is pure-Python and needs none of the heavy scientific stack, so
      # run it with uvx in an ephemeral env -- no tensorflow install required.
      - name: ruff check
        run: uvx ruff@0.6.9 check .
      - name: ruff format --check
        run: uvx ruff@0.6.9 format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - name: Verify the lock is in sync with pyproject
        run: uv lock --check
      - name: Run tests
        # -m "not slow" skips the multi-minute per-pixel golden fits; those run
        # in the nightly job below.  MPLBACKEND=Agg dodges the plt.clf() in the
        # per-spectrum path (B12) that otherwise needs a display.
        env:
          MPLBACKEND: Agg
        run: uv run --no-sync pytest -m "not slow" -q

  golden:
    name: Golden fits (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Pinned to 3.10: the baselines in tests/golden/ were recorded there, and
      # bit-level equality across numpy majors has not been verified.
      - name: Install (locked)
        run: uv sync --locked --dev --python 3.10
      - name: Run the full characterization suite
        env:
          MPLBACKEND: Agg
        run: uv run --no-sync pytest -q
